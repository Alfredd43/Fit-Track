<svg width="100%" height="100%" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f9ff"/>
  <g id="gym-illustration" transform="translate(400 300)">
    <ellipse cx="0" cy="120" rx="180" ry="30" fill="#e0e7ff"/>
    <!-- Barbell -->
    <rect x="-110" y="-10" width="220" height="20" rx="10" fill="#a5b4fc"/>
    <rect x="-130" y="-25" width="20" height="50" rx="8" fill="#6366f1"/>
    <rect x="110" y="-25" width="20" height="50" rx="8" fill="#6366f1"/>
    <!-- Person -->
    <g id="person">
      <!-- Arms -->
      <rect x="-60" y="-60" width="20" height="80" rx="10" fill="#fbbf24" transform="rotate(-20 -60 -60)"/>
      <rect x="40" y="-60" width="20" height="80" rx="10" fill="#fbbf24" transform="rotate(20 60 -60)"/>
      <!-- Body -->
      <rect x="-30" y="-40" width="60" height="100" rx="30" fill="#f59e42"/>
      <!-- Head -->
      <circle cx="0" cy="-60" r="28" fill="#fde68a"/>
      <!-- Shorts -->
      <rect x="-30" y="40" width="60" height="30" rx="15" fill="#6366f1"/>
      <!-- Legs -->
      <rect x="-20" y="70" width="16" height="50" rx="8" fill="#fbbf24"/>
      <rect x="4" y="70" width="16" height="50" rx="8" fill="#fbbf24"/>
      <!-- Shoes -->
      <ellipse cx="-12" cy="120" rx="12" ry="6" fill="#6366f1"/>
      <ellipse cx="12" cy="120" rx="12" ry="6" fill="#6366f1"/>
    </g>
    <!-- Decorative shapes -->
    <circle cx="-180" cy="-120" r="18" fill="#f472b6"/>
    <rect x="160" y="-140" width="36" height="36" rx="10" fill="#34d399"/>
    <path d="M-200 80 C-170 60 -140 100 -160 120 S-200 100 -200 80" fill="#60a5fa"/>
  </g>
</svg> 